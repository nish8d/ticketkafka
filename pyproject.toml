[project]
name = "ticket-pipeline"
version = "0.1.0"
description = "Learning Kafka with an LLM-generated support-ticket pipeline"
requires-python = ">=3.12"
dependencies = [
    # <2.12 because Quix Streams (stage 6) pins it; nothing here needs a newer client.
    "confluent-kafka[avro,schemaregistry]>=2.8,<2.12",
    "httpx>=0.27",
    "ollama>=0.6",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "quixstreams[avro]>=3.26,<4",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose Kafka broker running"]
# Unit tests by default; `uv run pytest -m integration` runs the integration suite.
addopts = "-m 'not integration' --import-mode=importlib"
